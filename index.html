<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운세의 신 PRO</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2D6A4F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3655/3655581.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #EBF2EC; }
        .tab-btn.active { color: #2D6A4F; font-weight: 800; }
        .tab-btn.active svg { stroke: #2D6A4F; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl flex flex-col justify-between relative pb-20">
        
        <!-- 상단 헤더 -->
        <header class="bg-white border-b border-slate-100 px-4 py-3.5 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center space-x-1.5">
                <h1 class="text-xl font-extrabold text-[#2D6A4F] tracking-tight">운세의 신</h1>
                <span class="bg-[#EBF5EE] text-[#2D6A4F] text-[10px] font-black px-1.5 py-0.5 rounded border border-[#2D6A4F]/20">PRO</span>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="openTalismanModal()" class="flex items-center space-x-1 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full text-xs font-bold text-amber-900 active:scale-95 transition">
                    <span>🎴</span>
                    <span>개운부적</span>
                </button>
                <button onclick="openChargeStore()" class="flex items-center space-x-1 bg-amber-100/70 border border-amber-300 px-2.5 py-1 rounded-full text-xs font-black text-amber-950 active:scale-95 transition">
                    <span class="w-4 h-4 rounded-full bg-amber-500 text-white flex items-center justify-center text-[10px]">C</span>
                    <span id="coinHeader">300</span>
                    <span class="text-[10px] bg-[#2D6A4F] text-white px-1.5 py-0.2 rounded-full ml-0.5">충전</span>
                </button>
            </div>
        </header>

        <!-- 메인 컨텐츠 영역 -->
        <main class="flex-1 p-4">
            
            <!-- 탭 1: 오늘운세 (입력 카드 뷰) -->
            <div id="view-today" class="space-y-4">
                
                <!-- 환영 및 사주 정보 입력 카드 -->
                <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 text-center space-y-4">
                    <div class="inline-flex items-center space-x-1 bg-amber-50 border border-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-full">
                        <span>🎁 가입 축하 300 복채 지급</span>
                    </div>

                    <div class="space-y-1">
                        <h2 class="text-2xl font-black text-slate-900">반가워요!</h2>
                        <p class="text-xs text-slate-500">사주를 분석할 기본 정보를 입력해 주세요</p>
                    </div>

                    <div class="space-y-3 text-left pt-2">
                        <!-- 이름 입력 -->
                        <div class="p-3.5 bg-slate-50/80 rounded-2xl border border-slate-100">
                            <label class="text-[11px] text-slate-400 font-medium block mb-1">이름 또는 닉네임</label>
                            <input type="text" id="inputName" class="w-full bg-transparent font-bold text-slate-800 text-sm focus:outline-none" value="최정오">
                        </div>

                        <!-- 생년월일 및 양력/음력/윤달 선택 -->
                        <div class="p-3.5 bg-slate-50/80 rounded-2xl border border-slate-100 space-y-2">
                            <div class="flex justify-between items-center">
                                <label class="text-[11px] text-slate-400 font-medium">생년월일</label>
                                <div class="flex bg-slate-200/80 p-0.5 rounded-lg text-[10px] font-bold">
                                    <button type="button" onclick="setCalType('solar')" id="btnCalSolar" class="px-2 py-0.5 rounded-md bg-white text-[#2D6A4F] shadow-xs">양력</button>
                                    <button type="button" onclick="setCalType('lunar')" id="btnCalLunar" class="px-2 py-0.5 rounded-md text-slate-600">음력</button>
                                    <button type="button" onclick="setCalType('leap')" id="btnCalLeap" class="px-2 py-0.5 rounded-md text-slate-600">윤달</button>
                                </div>
                            </div>
                            <div class="flex items-center justify-between">
                                <input type="date" id="inputBirth" class="w-full bg-transparent font-bold text-slate-800 text-sm focus:outline-none" value="1978-03-13">
                            </div>
                        </div>

                        <!-- 태어난 시간 -->
                        <div class="p-3.5 bg-slate-50/80 rounded-2xl border border-slate-100">
                            <label class="text-[11px] text-slate-400 font-medium block mb-1">태어난 시간 (30분 보정 적용)</label>
                            <select id="inputSijin" class="w-full bg-transparent font-bold text-slate-800 text-sm focus:outline-none">
                                <option value="-1">태어난 시간 모름</option>
                                <option value="0">자시 (23:30 ~ 01:29)</option>
                                <option value="1">축시 (01:30 ~ 03:29)</option>
                                <option value="2">인시 (03:30 ~ 05:29)</option>
                                <option value="3">묘시 (05:30 ~ 07:29)</option>
                                <option value="4">진시 (07:30 ~ 09:29)</option>
                                <option value="5" selected>巳시 (09:30 ~ 11:29) - 사시</option>
                                <option value="6">오시 (11:30 ~ 13:29)</option>
                                <option value="7">미시 (13:30 ~ 15:29)</option>
                                <option value="8">신시 (15:30 ~ 17:29)</option>
                                <option value="9">유시 (17:30 ~ 19:29)</option>
                                <option value="10">술시 (19:30 ~ 21:29)</option>
                                <option value="11">해시 (21:30 ~ 23:29)</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="startSajuAnalysis()" class="w-full bg-[#2D6A4F] hover:bg-[#22543D] text-white font-black text-sm py-4 rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center space-x-1.5">
                        <span>사주 분석 시작하기</span>
                        <span>✨</span>
                    </button>
                </div>

                <!-- 분석 결과 표시 영역 -->
                <div id="resultBox" class="hidden space-y-4">
                    <div class="bg-[#2D6A4F] text-white p-5 rounded-3xl space-y-2 shadow-sm">
                        <div class="flex justify-between items-center">
                            <span id="resultBadge" class="bg-amber-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full">운세 95점</span>
                            <span id="resultTalismanTitle" class="text-xs text-amber-200 font-bold"></span>
                        </div>
                        <h3 id="resultTitle" class="text-lg font-black leading-snug"></h3>
                        <p id="resultAdvice" class="text-xs text-emerald-100 leading-relaxed"></p>
                    </div>
                </div>

            </div>

            <!-- 탭 2: 정통 사주 명식 -->
            <div id="view-saju" class="hidden space-y-4">
                <div class="bg-white rounded-3xl border border-slate-100 p-5 shadow-sm space-y-3">
                    <h3 class="text-sm font-bold text-slate-900">사주 명식표</h3>
                    <div class="grid grid-cols-4 gap-2 text-center text-xs">
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <span class="text-[10px] text-slate-400 block mb-1">시주</span>
                            <p id="s_hour" class="font-bold text-slate-800">-</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <span class="text-[10px] text-slate-400 block mb-1">일주</span>
                            <p id="s_day" class="font-black text-[#2D6A4F]">-</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <span class="text-[10px] text-slate-400 block mb-1">월주</span>
                            <p id="s_month" class="font-bold text-slate-800">-</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <span class="text-[10px] text-slate-400 block mb-1">년주</span>
                            <p id="s_year" class="font-bold text-slate-800">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 탭 3: 테마 운세 -->
            <div id="view-theme" class="hidden space-y-3">
                <div class="bg-white rounded-3xl border border-slate-100 p-4 shadow-sm flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold text-slate-800">💰 평생 재물운 & 금고운</p>
                        <p class="text-[10px] text-slate-400">자산 흐름 및 투자 성공 분석</p>
                    </div>
                    <button onclick="alert('복채 220개로 열람되었습니다!')" class="bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-xl">220 복채</button>
                </div>
            </div>

            <!-- 탭 4: 마이페이지 -->
            <div id="view-mypage" class="hidden space-y-3">
                <div class="bg-white rounded-3xl border border-slate-100 p-5 shadow-sm space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-slate-500">현재 보유 복채</span>
                        <span id="coinMypage" class="text-lg font-black text-amber-900">300 🪙</span>
                    </div>
                    <button onclick="openChargeStore()" class="w-full bg-[#2D6A4F] text-white text-xs font-bold py-3 rounded-2xl shadow-sm">복채 충전하기</button>
                </div>
            </div>

        </main>

        <!-- 하단 4대 네비게이션 바 (아이콘) -->
        <nav class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-100 px-6 py-2.5 flex justify-between items-center z-40">
            <button onclick="switchTab('today')" id="tab-today" class="tab-btn active flex flex-col items-center space-y-1 text-slate-400">
                <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="text-[10px]">오늘운세</span>
            </button>
            <button onclick="switchTab('saju')" id="tab-saju" class="tab-btn flex flex-col items-center space-y-1 text-slate-400">
                <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span class="text-[10px]">정통사주</span>
            </button>
            <button onclick="switchTab('theme')" id="tab-theme" class="tab-btn flex flex-col items-center space-y-1 text-slate-400">
                <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span class="text-[10px]">궁합/테마</span>
            </button>
            <button onclick="switchTab('mypage')" id="tab-mypage" class="tab-btn flex flex-col items-center space-y-1 text-slate-400">
                <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="text-[10px]">마이페이지</span>
            </button>
        </nav>

    </div>

    <!-- 황금 부적 모달 (12종 고유 그래픽 실시간 연동) -->
    <div id="talismanModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl p-5 max-w-xs w-full text-center space-y-3.5 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="text-xs font-bold text-slate-800">🎴 영험한 전통 개운(開運) 부적</h3>
                <button onclick="closeTalismanModal()" class="text-slate-400 font-bold text-sm">&times;</button>
            </div>

            <!-- 황금빛 부적 카드 본체 -->
            <div class="w-full bg-[#FFF1B8] border-3 border-[#D97706] rounded-2xl p-4 shadow-md mx-auto flex flex-col justify-between items-center text-slate-900 space-y-2">
                <div id="talismanCmd" class="text-xs font-bold text-red-700 tracking-widest border-b border-red-300/80 w-full pb-1 text-center font-serif">
                    勅令 · 萬福
                </div>

                <h4 id="talismanTitle" class="text-sm font-black text-red-950">부적</h4>

                <!-- 12종 고유 그래픽 주입 영역 -->
                <div id="talismanGraphicBox" class="w-24 h-24 my-auto flex items-center justify-center"></div>

                <div class="w-full text-center space-y-0.5">
                    <p id="talismanPower" class="text-xs font-bold text-slate-950"></p>
                    <p id="talismanDesc" class="text-[10px] text-slate-700 leading-snug"></p>
                    <div class="border-t border-red-300/80 pt-1 text-[10px] text-slate-800 font-medium">
                        소지자: <span id="talismanOwner" class="font-bold underline">최정오</span> 님 평생 수호
                    </div>
                </div>
            </div>

            <button onclick="closeTalismanModal()" class="w-full bg-[#D97706] hover:bg-[#B45309] text-white text-xs font-bold py-2.5 rounded-xl shadow-sm transition active:scale-95">
                확인 🎴
            </button>
        </div>
    </div>

    <!-- 복채 충전소 모달 -->
    <div id="chargeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl p-5 max-w-xs w-full space-y-4 shadow-2xl text-center">
            <h3 class="font-bold text-slate-900 text-sm border-b pb-2">복채 충전소</h3>
            <button onclick="addCoin(500)" class="w-full p-3 bg-amber-50 border border-amber-300 rounded-xl font-bold text-xs text-amber-900">
                🪙 500 복채 무료 충전
            </button>
            <button onclick="closeChargeStore()" class="w-full text-slate-400 text-xs py-1">닫기</button>
        </div>
    </div>

    <script>
        let currentCoin = 300;
        let selectedCalendarType = 'solar';
        let currentTalisman = null;

        // 12종 고유 부적 SVG 그래픽
        function renderDistinctTalisman(title) {
            if (!title) title = "재물만복부";
            
            if (title.includes("재물") || title.includes("만복")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="50" r="44" stroke="#DC2626" stroke-width="4" fill="#FEF2F2" /><rect x="34" y="34" width="32" height="32" stroke="#DC2626" stroke-width="3" fill="#FEE2E2" /><circle cx="50" cy="18" r="8" stroke="#DC2626" stroke-width="2.5" fill="none" /><circle cx="50" cy="82" r="8" stroke="#DC2626" stroke-width="2.5" fill="none" /><circle cx="18" cy="50" r="8" stroke="#DC2626" stroke-width="2.5" fill="none" /><circle cx="82" cy="50" r="8" stroke="#DC2626" stroke-width="2.5" fill="none" /><text x="50" y="56" font-family="'Noto Serif KR', serif" font-weight="900" font-size="14" fill="#991B1B" text-anchor="middle">萬福</text></svg>`;
            } else if (title.includes("금고") || title.includes("수호")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M50 6 L88 22 L88 68 L50 94 L12 68 L12 22 Z" stroke="#DC2626" stroke-width="4" fill="#FEF2F2" /><rect x="32" y="40" width="36" height="30" rx="4" stroke="#DC2626" stroke-width="3.5" fill="#FEE2E2" /><path d="M40 40 V28 C40 22 60 22 60 28 V40" stroke="#DC2626" stroke-width="4" fill="none" /><text x="50" y="61" font-family="'Noto Serif KR', serif" font-weight="900" font-size="12" fill="#991B1B" text-anchor="middle">金庫</text></svg>`;
            } else if (title.includes("사업") || title.includes("대성")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M50 6 L78 34 H58 V92 H42 V34 H22 Z" stroke="#DC2626" stroke-width="4" fill="#FEF2F2" /><path d="M18 70 L50 46 L82 70" stroke="#DC2626" stroke-width="3.5" fill="none" stroke-linecap="round" /><path d="M18 84 L50 60 L82 84" stroke="#DC2626" stroke-width="3.5" fill="none" stroke-linecap="round" /><text x="50" y="46" font-family="'Noto Serif KR', serif" font-weight="900" font-size="12" fill="#991B1B" text-anchor="middle">大成</text></svg>`;
            } else if (title.includes("인연") || title.includes("화합")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="36" cy="42" r="28" stroke="#DC2626" stroke-width="3.5" fill="#FEF2F2" /><circle cx="64" cy="42" r="28" stroke="#DC2626" stroke-width="3.5" fill="#FEF2F2" /><path d="M50 16 C38 0 10 24 50 68 C90 24 62 0 50 16 Z" stroke="#DC2626" stroke-width="3.5" fill="#FEE2E2" /><text x="50" y="90" font-family="'Noto Serif KR', serif" font-weight="900" font-size="16" fill="#991B1B" text-anchor="middle">囍 和合</text></svg>`;
            } else if (title.includes("도화") || title.includes("매혹")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><g fill="#FEE2E2" stroke="#DC2626" stroke-width="3"><circle cx="50" cy="24" r="16" /><circle cx="74" cy="42" r="16" /><circle cx="65" cy="70" r="16" /><circle cx="35" cy="70" r="16" /><circle cx="26" cy="42" r="16" /></g><circle cx="50" cy="48" r="12" fill="#DC2626" /><circle cx="50" cy="48" r="6" fill="#FFF" /><text x="50" y="90" font-family="'Noto Serif KR', serif" font-weight="900" font-size="14" fill="#991B1B" text-anchor="middle">桃花</text></svg>`;
            } else if (title.includes("소원") || title.includes("성취")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="58" r="32" stroke="#DC2626" stroke-width="4" fill="#FEF2F2" /><path d="M50 8 C32 28 68 38 50 58 C32 38 68 28 50 8 Z" stroke="#DC2626" stroke-width="3.5" fill="#FEE2E2" /><text x="50" y="66" font-family="'Noto Serif KR', serif" font-weight="900" font-size="15" fill="#991B1B" text-anchor="middle">成就</text></svg>`;
            } else if (title.includes("귀인") || title.includes("천우신조")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><polygon points="50,6 62,36 94,36 68,56 78,88 50,70 22,88 32,56 6,36 38,36" stroke="#DC2626" stroke-width="3.5" fill="#FEF2F2" /><circle cx="50" cy="48" r="14" stroke="#DC2626" stroke-width="2.5" fill="#FEE2E2" /><text x="50" y="54" font-family="'Noto Serif KR', serif" font-weight="900" font-size="12" fill="#991B1B" text-anchor="middle">貴人</text></svg>`;
            } else if (title.includes("관운") || title.includes("승진")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M20 42 Q50 12 80 42 L90 52 H10 Z" stroke="#DC2626" stroke-width="4" fill="#FEF2F2" /><rect x="34" y="52" width="32" height="12" stroke="#DC2626" stroke-width="3" fill="#FEE2E2" /><path d="M18 72 H82 M26 82 H74 M34 92 H66" stroke="#DC2626" stroke-width="4" stroke-linecap="round" /><text x="50" y="42" font-family="'Noto Serif KR', serif" font-weight="900" font-size="11" fill="#991B1B" text-anchor="middle">昇進</text></svg>`;
            } else if (title.includes("장원") || title.includes("급제")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M50 8 L58 32 L54 74 L46 74 L42 32 Z" stroke="#DC2626" stroke-width="3.5" fill="#FEF2F2" /><polygon points="46,74 54,74 50,92" fill="#DC2626" /><circle cx="50" cy="22" r="6" fill="#DC2626" /><path d="M16 52 Q50 34 84 52" stroke="#DC2626" stroke-width="3.5" fill="none" /><text x="50" y="60" font-family="'Noto Serif KR', serif" font-weight="900" font-size="12" fill="#991B1B" text-anchor="middle">及第</text></svg>`;
            } else if (title.includes("벽사") || title.includes("소재")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M50 6 L56 20 V72 L50 94 L44 72 V20 Z" stroke="#DC2626" stroke-width="4" fill="#FEF2F2" /><path d="M24 30 H76 M34 38 H66" stroke="#DC2626" stroke-width="4" stroke-linecap="round" /><path d="M20 68 L44 74 M80 68 L56 74" stroke="#DC2626" stroke-width="3.5" /><text x="50" y="58" font-family="'Noto Serif KR', serif" font-weight="900" font-size="13" fill="#991B1B" text-anchor="middle">辟邪</text></svg>`;
            } else if (title.includes("칠성") || title.includes("무병")) {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="50" r="44" stroke="#DC2626" stroke-width="2.5" fill="#FEF2F2" /><path d="M22 22 L40 26 L46 44 L30 52 L22 22 M46 44 L64 62 L78 64 L86 82" stroke="#DC2626" stroke-width="3.5" fill="none" stroke-linecap="round" /><circle cx="22" cy="22" r="5" fill="#DC2626" /><circle cx="40" cy="26" r="5" fill="#DC2626" /><circle cx="46" cy="44" r="5" fill="#DC2626" /><circle cx="30" cy="52" r="5" fill="#DC2626" /><circle cx="64" cy="62" r="5" fill="#DC2626" /><circle cx="78" cy="64" r="5" fill="#DC2626" /><circle cx="86" cy="82" r="5" fill="#DC2626" /><text x="50" y="86" font-family="'Noto Serif KR', serif" font-weight="900" font-size="12" fill="#991B1B" text-anchor="middle">無病</text></svg>`;
            } else {
                return `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="50" r="42" stroke="#DC2626" stroke-width="3.5" fill="#FEF2F2" /><path d="M50 8 A21 21 0 0 0 50 50 A21 21 0 0 1 50 92 A42 42 0 0 0 50 8 Z" fill="#DC2626" /><circle cx="50" cy="29" r="6" fill="#FEF2F2" /><circle cx="50" cy="71" r="6" fill="#DC2626" /><text x="50" y="90" font-family="'Noto Serif KR', serif" font-weight="900" font-size="12" fill="#991B1B" text-anchor="middle">淸心</text></svg>`;
            }
        }

        // 양력 / 음력 / 윤달 토글
        function setCalType(type) {
            selectedCalendarType = type;
            ['solar', 'lunar', 'leap'].forEach(t => {
                const btn = document.getElementById(`btnCal${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (btn) {
                    if (t === type) {
                        btn.className = "px-2 py-0.5 rounded-md bg-white text-[#2D6A4F] shadow-xs";
                    } else {
                        btn.className = "px-2 py-0.5 rounded-md text-slate-600";
                    }
                }
            });
        }

        function switchTab(tabId) {
            ['today', 'saju', 'theme', 'mypage'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active');
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        async function startSajuAnalysis() {
            const name = document.getElementById('inputName').value || "최정오";
            const birth = document.getElementById('inputBirth').value || "1978-03-13";
            const sijin = parseInt(document.getElementById('inputSijin').value);
            
            const [year, month, day] = birth.split('-').map(Number);

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: name,
                        year: year,
                        month: month,
                        day: day,
                        calendar_type: selectedCalendarType,
                        sijin_index: sijin === -1 ? null : sijin,
                        is_unknown_time: sijin === -1
                    })
                });
                const data = await res.json();
                
                currentTalisman = data.fortunes.daily.talisman;

                // 결과 노출
                document.getElementById('resultTitle').innerText = data.fortunes.daily.title;
                document.getElementById('resultAdvice').innerText = data.fortunes.daily.advice;
                document.getElementById('resultBadge').innerText = `운세 ${data.fortunes.daily.score}점`;
                document.getElementById('resultTalismanTitle').innerText = currentTalisman.title;
                document.getElementById('resultBox').classList.remove('hidden');

                // 사주 명식
                document.getElementById('s_year').innerText = data.saju_data.year_pillar;
                document.getElementById('s_month').innerText = data.saju_data.month_pillar;
                document.getElementById('s_day').innerText = data.saju_data.day_pillar;
                document.getElementById('s_hour').innerText = data.saju_data.hour_pillar || "時未詳";

                // 부적 팝업 자동 열기
                openTalismanModal();

            } catch(e) {
                alert('사주 분석 데이터를 불러오지 못했습니다.');
            }
        }

        function openTalismanModal() {
            const name = document.getElementById('inputName').value || "최정오";
            if (!currentTalisman) {
                // 기본값
                currentTalisman = {
                    title: "천우신조부 (天佑神助符)",
                    desc: "결정적인 순간 귀인의 손길을 이어주는 수호 기운",
                    power: "귀인 조력 · 위기 탈출",
                    chinese: "勅令 · 萬福"
                };
            }

            document.getElementById('talismanTitle').innerText = currentTalisman.title;
            document.getElementById('talismanDesc').innerText = currentTalisman.desc;
            document.getElementById('talismanPower').innerText = currentTalisman.power;
            document.getElementById('talismanCmd').innerText = currentTalisman.chinese || "勅令 · 萬福";
            document.getElementById('talismanOwner').innerText = name;

            // 고유 그래픽 주입
            document.getElementById('talismanGraphicBox').innerHTML = renderDistinctTalisman(currentTalisman.title);
            document.getElementById('talismanModal').classList.remove('hidden');
        }

        function closeTalismanModal() {
            document.getElementById('talismanModal').classList.add('hidden');
        }

        function openChargeStore() { document.getElementById('chargeModal').classList.remove('hidden'); }
        function closeChargeStore() { document.getElementById('chargeModal').classList.add('hidden'); }
        
        function addCoin(amt) {
            currentCoin += amt;
            document.getElementById('coinHeader').innerText = currentCoin;
            document.getElementById('coinMypage').innerText = `${currentCoin} 🪙`;
            closeChargeStore();
        }

        window.addEventListener('DOMContentLoaded', () => {
            // 캐시 무효화
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(r => r.forEach(reg => reg.unregister()));
            }
        });
    </script>
</body>
</html>
