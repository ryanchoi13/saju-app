name: Fashion regression

on:
  push:
    branches: [codex/fix-fashion-tone-and-garments]
  pull_request:
    paths:
      - 'fashion_v2/**'
      - 'assets/dalha-garments/**'
      - 'backend/tests/test_fashion*'
      - 'scripts/*fashion*'
      - '.github/workflows/fashion-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fashion-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Syntax and regression checks
        env:
          PYTHONPATH: .:backend
        run: |
          mkdir -p fashion-review-artifacts
          python -m compileall -q fashion_v2
          node --check assets/dalha-garments/integration.js
          node --check assets/dalha-garments/identity.js
          python -m pytest -q backend/tests/test_fashion*.py | tee fashion-review-artifacts/pytest.log
          python scripts/test_fashion_tone_regression.py 2>&1 | tee fashion-review-artifacts/tone-tests.log
          python scripts/build_svg_review.py
          node scripts/test_fashion_garment_regression.mjs | tee fashion-review-artifacts/garment-tests.log
      - name: Actual mobile modal checks
        run: python scripts/test_fashion_mobile.py
      - name: Collect reproducible review source
        if: always()
        run: |
          mkdir -p fashion-review-artifacts
          git archive HEAD -o fashion-review-artifacts/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fashion-regression-review
          path: fashion-review-artifacts/
          retention-days: 7
